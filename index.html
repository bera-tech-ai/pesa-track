<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesa Track</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            min-height: 100vh;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2e7d32;
            text-align: center;
            border-bottom: 3px solid #2e7d32;
            padding-bottom: 10px;
            margin-top: 0;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            background: #2e7d32;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background: #1b5e20;
        }
        .expense-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
        }
        .expense-name {
            font-weight: bold;
        }
        .expense-amount {
            color: #2e7d32;
        }
        #total {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #2e7d32;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Pesa Track</h1>
        <form id="expense-form">
            <input type="text" id="name" placeholder="Expense name" required>
            <input type="number" id="amount" placeholder="Amount" min="0.01" step="0.01" required>
            <button type="submit">Add Expense</button>
        </form>
        <div id="expense-list"></div>
        <div id="total">Total: Ksh 0.00</div>
    </div>

    <script>
        let expenses = [
            { name: "Groceries", amount: 1500 },
            { name: "Bus fare", amount: 120 },
            { name: "Coffee", amount: 350 },
            { name: "Internet", amount: 2500 }
        ];

        function render() {
            const list = document.getElementById('expense-list');
            list.innerHTML = '';

            let total = 0;
            for (let expense of expenses) {
                total += expense.amount;

                const itemDiv = document.createElement('div');
                itemDiv.className = 'expense-item';

                const nameSpan = document.createElement('span');
                nameSpan.className = 'expense-name';
                nameSpan.textContent = expense.name;

                const amountSpan = document.createElement('span');
                amountSpan.className = 'expense-amount';
                amountSpan.textContent = `Ksh ${expense.amount.toFixed(2)}`;

                itemDiv.appendChild(nameSpan);
                itemDiv.appendChild(amountSpan);
                list.appendChild(itemDiv);
            }

            document.getElementById('total').textContent = `Total: Ksh ${total.toFixed(2)}`;
        }

        document.getElementById('expense-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const nameInput = document.getElementById('name');
            const amountInput = document.getElementById('amount');

            const name = nameInput.value.trim();
            const amount = parseFloat(amountInput.value);

            if (name !== '' && amount > 0) {
                expenses.push({ name: name, amount: amount });
                render();
                nameInput.value = '';
                amountInput.value = '';
            }
        });

        render();
    </script>
</body>
</html>
